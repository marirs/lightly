# Isolated feasibility harness for the Image-Adaptive 3D LUT model. Not part of the Lightly app.
# Generated project (LUTBench.xcodeproj) is gitignored; run ../run_ios.sh which stages BenchData/ first.
name: LUTBench
options:
  bundleIdPrefix: com.lightlylabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is passed on the xcodebuild command line by run_ios.sh (LUTBENCH_TEAM).
targets:
  LUTBench:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Folder reference: copied verbatim so the .mlpackage files stay uncompiled and the app
      # can time MLModel.compileModel(at:) itself. Staged by run_ios.sh (gitignored).
      - path: BenchData
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: LUTBench
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lightlylabs.lutbench
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/LUTBench-Bridging-Header.h
