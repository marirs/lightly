  return `<h2 class="j">App icon and logo · the eight-ray mark in spectrum colours (chosen)</h2><div class="row">${ICON_CONCEPTS.map(([k, t, d]) => `<figure style="width: 300px"><div style="display: flex; justify-content: center; padding: 18px; border-radius: 28px; background: #2E2F33">${appIcon(k, 220)}</div><div style="display: flex; gap: 12px; align-items: flex-end; justify-content: center; padding: 12px; border-radius: 20px; background: #2E2F33">${ladder(k)}</div><div style="display: flex; gap: 12px; align-items: flex-end; justify-content: center; padding: 12px; border-radius: 20px; background: #E9E9E4">${ladder(k)}</div><figcaption><b>${t}</b><br>${d}</figcaption></figure>`).join('')}</div>`;
}
// Owner amendments approved 2026-10-11 (docs/ui/proposals/lightly-2-oct11): the new screens.
J.find(([t]) => t === 'Portrait')[1].splice(4, 0, ['pt-smile', 'Smile · a slider from less to more (centre = the photo as taken)', ED('portrait', 'smile', { pt: { sub: 'smile', smooth: 1 } })]);
J.push(['Text', [
  ['tx-empty', 'Text · nothing added yet', ED('text', 'sunset', { dockAtEnd: true, canUndo: false })],
  ['tx-selected', 'Text added · drag to move; corner handle resizes and turns; ✕ deletes', ED('text', 'sunset', { tx: { layers: 1 }, dockAtEnd: true })],
  ['tx-two', 'Two text boxes · each chosen from the row', ED('text', 'sunset', { tx: { layers: 2, font: 'Bebas Neue', turn: 0, y: 0.12 }, dockAtEnd: true })],
  ['tx-edit', 'Typing · the field sits above the keyboard', { ...ED('text', 'sunset', { tx: { layers: 1 }, dockAtEnd: true }), overlay: 'textEdit' }]]]);
J.push(['Dock and theme', [
  ['dock-start', 'Dock at rest · eight tools; the next one shows cut off at the edge: swipe for more', ED('develop', 'lake', { dev: HONEY })],
  ['dock-end', 'Dock scrolled to the end', ED('text', 'sunset', { tx: { layers: 1 }, dockAtEnd: true })],
  ['theme-cycle', 'Double-tap any empty space (not the photo) · cycles System → Light → Dark', { ...ED('develop', 'lake', { dev: HONEY }), themeToast: true }]]]);
// Owner amendments approved 2026-10-11 (second, docs/ui/proposals/lightly-2-oct11b): text weight screens.
J.find(([t]) => t === 'Text')[1].push(
  ['tx-thin', 'Weight · Thin', ED('text', 'sunset', { tx: { layers: 1, weight: 'thin', font: 'Montserrat' }, dockAtEnd: true })],
  ['tx-bold', 'Weight · Bold', ED('text', 'sunset', { tx: { layers: 1, weight: 'bold' }, dockAtEnd: true })],
  ['tx-single', 'A font with one weight: the others greyed', ED('text', 'sunset', { tx: { layers: 1, font: 'Bebas Neue', turn: 0 }, dockAtEnd: true })]);
function render() {
  const d0 = DEVICES[state.device]; let n = 0; let out = iconSection(); FILLS = [];
  for (const [title, list] of J) {
    out += `<h2 class="j">${title}</h2><div class="row">`;
    for (const [id, label, spec] of list) {
      if (spec.iosOnly && d0.os !== 'ios') continue;
      for (const th of state.themes) {
        const d = { ...d0, _theme: th };
        const shown = spec.themeToast ? { ...spec, s: { ...spec.s, toast: th === 't-dark' ? 'Dark theme' : 'Light theme' } } : spec;
        let body; try { body = screen(shown, d); } catch (err) { body = `<div style="padding: 20px; color: var(--danger)">Render error: ${err.message}</div>`; }
        out += `<figure id="${id}-${th}"><div class="frame ${th}" style="width: ${d.w}px; height: ${d.h}px; border-radius: ${d.radius}px"><div class="scr">${body}</div></div><figcaption><b>${label}</b><br>${id} · ${th === 't-dark' ? 'Dark' : 'Light'} · ${d.name} ${d.w}×${d.h}</figcaption></figure>`;
        n++;
      }
    }
    out += '</div>';
  }
  document.getElementById('out').innerHTML = out;
  document.body.style.setProperty('--z', state.zoom);
  fillStages();
  document.getElementById('count').textContent = `${n} screens`;
  const grp = (id, items, cur, set) => {
    const el = document.getElementById(id);
    el.innerHTML = items.map(([k, l], i) => `<button aria-pressed="${JSON.stringify(cur) === JSON.stringify(k)}" data-i="${i}">${l}</button>`).join('');
    el.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; set(items[+b.dataset.i][0]); try { localStorage.setItem('lightly2-view', JSON.stringify(state)); } catch (er) { /* ignore */ } render(); };
  };
  grp('devices', Object.entries(DEVICES).map(([k, v]) => [k, v.name]), state.device, (k) => { state.device = k; });
  grp('themes', [[['t-dark', 't-light'], 'Both'], [['t-dark'], 'Dark'], [['t-light'], 'Light']], state.themes, (k) => { state.themes = k; });
  grp('zooms', [[0.4, '40%'], [0.6, '60%'], [1, '100%']], state.zoom, (k) => { state.zoom = k; });
}
render();
</script>
