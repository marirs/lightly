name: Lightly
options:
  bundleIdPrefix: com.lightlylabs
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    # Version and build come from version.properties and scripts/version.sh; every script that builds the app
    # passes MARKETING_VERSION and CURRENT_PROJECT_VERSION. A build made without them (e.g. from the Xcode IDE)
    # shows build 0, so it is never mistaken for a packaged one.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    # The Xcode project lives in ios/; shared scripts, docs and experiments (Look pack, golden set)
    # sit at the repository root next to android/.
    LIGHTLY_REPO_ROOT: $(SRCROOT)/..
    # Release gate: "pending legal sign-off (training data)" for the depth model. Set to YES only
    # after the sign-off (docs/v1/depth-evaluation.md T1).
    LIGHTLY_DEPTH_MODEL_TRAINING_DATA_SIGNED_OFF: "NO"
    # Release gate: "pending legal sign-off (training data: Places2)" for the Remove model (LaMa).
    # Set to YES only after the sign-off (docs/v1/remove-evaluation.md §8).
    LIGHTLY_REMOVE_MODEL_TRAINING_DATA_SIGNED_OFF: "NO"

targets:
  Lightly:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      # Copies the Look pack into Lightly.app/LookPack before the app is assembled.
      - target: LookPack
    sources:
      - path: Lightly
        excludes:
          - "**/.DS_Store"
          # Legacy catalogues derived from third-party packs: nothing in the app reads them (the
          # format-3 Look pack is the catalogue), so they are not shipped (release register).
          - "Resources/Presets/presets_photo.json"
          - "Resources/Presets/luts_video.json"
      # The approved Develop catalogue (categories and preset names), shared with Android. Copied
      # verbatim; favourites (slice 1) and the Develop panel (slice 2) read it.
      - path: ../presets/develop-design-ui.json
        buildPhase: resources
      # Readable preset display names (owner feedback 2026-10-05), shared with Android; applied over the pack's and the
      # catalogue's names when they load (shared/look-pack/display_names.py). Ids, versions and recipes are unchanged.
      - path: ../shared/look-pack/names/display-names.json
        buildPhase: resources
      # Rendering contract v2, verbatim: the Develop model constants (and their digest) the app bakes
      # preset LUTs with. Read at launch by DevelopModel; the preset pack is refused if it was built
      # against other constants.
      - path: ../shared/contracts/rendering-v2.json
        buildPhase: resources
      # The approved bundled backgrounds for Change background › Image (prototype BACKGROUNDS,
      # docs/ui/assets/photos, Unsplash License; sources and hashes in that folder's SOURCES.csv).
      - path: ../docs/ui/assets/photos/landscape_01.jpg
        buildPhase: resources
      - path: ../docs/ui/assets/photos/landscape_01_thumb.jpg
        buildPhase: resources
      - path: ../docs/ui/assets/photos/sunset_03.jpg
        buildPhase: resources
      - path: ../docs/ui/assets/photos/sunset_03_thumb.jpg
        buildPhase: resources
      - path: ../docs/ui/assets/photos/wellexposed_02.jpg
        buildPhase: resources
      - path: ../docs/ui/assets/photos/wellexposed_02_thumb.jpg
        buildPhase: resources
      - path: ../docs/ui/assets/photos/backlit_02.jpg
        buildPhase: resources
      - path: ../docs/ui/assets/photos/backlit_02_thumb.jpg
        buildPhase: resources
      - path: ../docs/ui/assets/photos/landscape_02.jpg
        buildPhase: resources
      - path: ../docs/ui/assets/photos/landscape_02_thumb.jpg
        buildPhase: resources
      - path: ../docs/ui/assets/photos/landscape_03.jpg
        buildPhase: resources
      - path: ../docs/ui/assets/photos/landscape_03_thumb.jpg
        buildPhase: resources
      - path: ../docs/ui/assets/photos/sunset_02.jpg
        buildPhase: resources
      - path: ../docs/ui/assets/photos/sunset_02_thumb.jpg
        buildPhase: resources
      - path: ../docs/ui/assets/photos/wellexposed_03.jpg
        buildPhase: resources
      - path: ../docs/ui/assets/photos/wellexposed_03_thumb.jpg
        buildPhase: resources
      # The four approved watermark fonts and their licences (shared/fonts, SIL OFL 1.1; the OFL
      # requires the licence to ship with the fonts). Read by URL in WatermarkFonts.
      - path: ../shared/fonts/DancingScript-Variable.ttf
        buildPhase: resources
      - path: ../shared/fonts/DancingScript-OFL.txt
        buildPhase: resources
      - path: ../shared/fonts/Lora-Variable.ttf
        buildPhase: resources
      - path: ../shared/fonts/Lora-OFL.txt
        buildPhase: resources
      - path: ../shared/fonts/Allura-Regular.ttf
        buildPhase: resources
      - path: ../shared/fonts/CormorantGaramond-Variable.ttf
        buildPhase: resources
      - path: ../shared/fonts/Inter-Variable.ttf
        buildPhase: resources
      - path: ../shared/fonts/Caveat-Variable.ttf
        buildPhase: resources
      - path: ../shared/fonts/Allura-OFL.txt
        buildPhase: resources
      - path: ../shared/fonts/CormorantGaramond-OFL.txt
        buildPhase: resources
      - path: ../shared/fonts/Inter-OFL.txt
        buildPhase: resources
      - path: ../shared/fonts/Caveat-OFL.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lightlylabs.lightly
        # Approved layouts: iPhone portrait only (one phone layout, controls below the photo);
        # iPad in every orientation (controls below in portrait, beside in landscape).
        # v3 differs: iPhone also allowed both landscapes.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPhone and iPad (XcodeGen's default too, stated so it cannot silently change).
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_NSCameraUsageDescription: "Lightly uses the camera only when you choose to take a new photo. Nothing is captured until you tap the shutter."
        # Add-only: Lightly writes exports but never reads the library. Selection
        # goes through the native picker, which needs no authorisation at all.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Lightly saves your exported photos to your library. It never reads your library — choosing a photo uses Apple's own picker."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
    postBuildScripts:
      # Last phase: fail the build (so nothing gets installed) unless the built product carries the
      # app icon. Sandboxed: it reads only the declared product files below.
      - name: Check app icon
        script: '"${LIGHTLY_REPO_ROOT}/scripts/check_app_icon.sh"'
        # Every build, not only when an input changed: the check is cheap and must never be skipped.
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(LIGHTLY_REPO_ROOT)/scripts/check_app_icon.sh
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Assets.car
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIcon60x60@2x.png
    info:
      path: Lightly/Generated-Info.plist
      properties:
        CFBundleDisplayName: Lightly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Release gate for the depth model (ios/Tools/bundle_depth_model.sh).
        LightlyDepthModelTrainingDataSignedOff: $(LIGHTLY_DEPTH_MODEL_TRAINING_DATA_SIGNED_OFF)
        # Release gate for the Remove model (ios/Tools/bundle_remove_model.sh).
        LightlyRemoveModelTrainingDataSignedOff: $(LIGHTLY_REMOVE_MODEL_TRAINING_DATA_SIGNED_OFF)
        # Approved Launch: the eight-ray mark alone, centred, on the background colour. The
        # system shows it until the first frame; Welcome follows. No timer holds it on screen.
        UILaunchScreen:
          UIImageName: LaunchMark
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: false

  LightlyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/LightlyTests
        excludes:
          # Reference images are test data read from disk at runtime, not build
          # inputs. Including them makes deleting a stale reference break the
          # build instead of simply re-recording it.
          - "__Snapshots__/**"
    dependencies:
      - target: Lightly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lightlylabs.lightly.tests
        GENERATE_INFOPLIST_FILE: YES

  # End-to-end verification on a real simulator. Kept in its own scheme so the
  # fast unit/snapshot suite is not slowed by launching the app.
  LightlyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/LightlyUITests
    dependencies:
      - target: Lightly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lightlylabs.lightly.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lightly

aggregateTargets:
  # Copies the git-ignored preset pack (format 3) into the app bundle (scripts/bundle_look_pack.sh).
  #
  # A separate target only so that this one script runs without user-script sandboxing; the
  # app target and every other script keep ENABLE_USER_SCRIPT_SANDBOXING: YES. Why it cannot be
  # sandboxed: the pack's location is resolved at build time ($LIGHTLY_LOOK_PACK_DIR, this
  # checkout, or the main checkout of a .claude/worktrees/<name> worktree) and its LUT file
  # names come from the manifest, while the sandbox only grants access to input and output paths
  # declared statically, file by file (a declared directory covers the directory entry only, not
  # its contents). Xcode has no per-phase sandbox switch, hence the one-script target.
  LookPack:
    buildScripts:
      - name: Bundle Look pack
        script: '"${LIGHTLY_REPO_ROOT}/scripts/bundle_look_pack.sh"'
        # Always run: the pack can change without any build input changing.
        basedOnDependencyAnalysis: false
      - name: Bundle depth model
        script: '"${SRCROOT}/Tools/bundle_depth_model.sh"'
        basedOnDependencyAnalysis: false
      - name: Bundle Remove model
        script: '"${SRCROOT}/Tools/bundle_remove_model.sh"'
        basedOnDependencyAnalysis: false
      # Version and build for About from git, on every build (Xcode IDE builds included).
      - name: Write build info
        script: '"${SRCROOT}/Tools/write_build_info.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LIGHTLY_APP_WRAPPER_NAME: Lightly.app

schemes:
  Lightly:
    build:
      targets:
        Lightly: all
        LightlyTests: [test]
    test:
      targets:
        - LightlyTests

  LightlyUITests:
    build:
      targets:
        Lightly: all
        LightlyUITests: [test]
    test:
      targets:
        - LightlyUITests
