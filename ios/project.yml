name: Lightly
options:
  bundleIdPrefix: com.lightlylabs
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    # The Xcode project lives in ios/; shared scripts, docs and experiments (Look pack, golden set)
    # sit at the repository root next to android/.
    LIGHTLY_REPO_ROOT: $(SRCROOT)/..

targets:
  Lightly:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      # Copies the Look pack into Lightly.app/LookPack before the app is assembled.
      - target: LookPack
    sources:
      - path: Lightly
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lightlylabs.lightly
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_NSCameraUsageDescription: "Lightly uses the camera only when you choose to take a new photo. Nothing is captured until you tap the shutter."
        # Add-only: Lightly writes exports but never reads the library. Selection
        # goes through the native picker, which needs no authorisation at all.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Lightly saves your exported photos to your library. It never reads your library — choosing a photo uses Apple's own picker."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
    postBuildScripts:
      # Last phase: fail the build (so nothing gets installed) unless the built product carries the
      # app icon. Sandboxed: it reads only the declared product files below.
      - name: Check app icon
        script: '"${LIGHTLY_REPO_ROOT}/scripts/check_app_icon.sh"'
        # Every build, not only when an input changed: the check is cheap and must never be skipped.
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(LIGHTLY_REPO_ROOT)/scripts/check_app_icon.sh
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Assets.car
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIcon60x60@2x.png
    info:
      path: Lightly/Generated-Info.plist
      properties:
        CFBundleDisplayName: Lightly

  LightlyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/LightlyTests
        excludes:
          # Reference images are test data read from disk at runtime, not build
          # inputs. Including them makes deleting a stale reference break the
          # build instead of simply re-recording it.
          - "__Snapshots__/**"
    dependencies:
      - target: Lightly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lightlylabs.lightly.tests
        GENERATE_INFOPLIST_FILE: YES

  # End-to-end verification on a real simulator. Kept in its own scheme so the
  # fast unit/snapshot suite is not slowed by launching the app.
  LightlyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/LightlyUITests
    dependencies:
      - target: Lightly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lightlylabs.lightly.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lightly

aggregateTargets:
  # Copies the git-ignored Look pack into the app bundle (scripts/bundle_look_pack.sh).
  #
  # A separate target only so that this one script runs without user-script sandboxing; the
  # app target and every other script keep ENABLE_USER_SCRIPT_SANDBOXING: YES. Why it cannot be
  # sandboxed: the pack's location is resolved at build time ($LIGHTLY_LOOK_PACK_DIR, this
  # checkout, or the main checkout of a .claude/worktrees/<name> worktree) and its LUT file
  # names come from the manifest, while the sandbox only grants access to input and output paths
  # declared statically, file by file (a declared directory covers the directory entry only, not
  # its contents). Xcode has no per-phase sandbox switch, hence the one-script target.
  LookPack:
    buildScripts:
      - name: Bundle Look pack
        script: '"${LIGHTLY_REPO_ROOT}/scripts/bundle_look_pack.sh"'
        # Always run: the pack can change without any build input changing.
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LIGHTLY_APP_WRAPPER_NAME: Lightly.app

schemes:
  Lightly:
    build:
      targets:
        Lightly: all
        LightlyTests: [test]
    test:
      targets:
        - LightlyTests

  LightlyUITests:
    build:
      targets:
        Lightly: all
        LightlyUITests: [test]
    test:
      targets:
        - LightlyUITests
