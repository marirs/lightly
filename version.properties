# Lightly version, one source for both apps (docs/v1/release/README.md, version and build scheme).
# The marketing version is set here by hand; the build number is derived from git by scripts/version.sh:
# YYMMDD of HEAD's commit date (local time) followed by HEAD's three-digit sequence among that day's commits,
# e.g. 261005047. It increases with every commit, is the same on iOS and Android, and fits Android's versionCode.
marketingVersion=1.0.0
